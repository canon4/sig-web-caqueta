# ==============================================================
#  SIG Web Caquetá · todo el sistema en contenedores
#
#    cp .env.example .env   (y cambia las contraseñas)
#    docker compose up -d --build
#
#  Servicios:
#    postgis       PostgreSQL 16 + PostGIS (datos)
#    importador    carga datos/ a PostGIS y crea la vista (se ejecuta y termina)
#    geoserver     GeoServer 3 (WMS/WFS)
#    configurador  crea workspace, data store, capas y estilos (se ejecuta y termina)
#    web           visor Leaflet + proxy /geoserver/ (Nginx)
#
#  SEGURIDAD: todos los puertos se publican SOLO en 127.0.0.1.
#  Docker se salta ufw, así que nunca publiques en 0.0.0.0.
#  El acceso público lo da el servidor web del host (Apache/Nginx) -> 127.0.0.1:WEB_PORT
# ==============================================================
name: sig-web-caqueta

x-entorno-db: &entorno-db
  DB_HOST: postgis
  DB_NAME: ${DB_NAME}
  DB_OWNER: ${DB_OWNER}
  DB_OWNER_PASS: ${DB_OWNER_PASS}
  DB_APP_USER: ${DB_APP_USER}
  DB_APP_PASS: ${DB_APP_PASS}

services:
  postgis:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_OWNER}
      POSTGRES_PASSWORD: ${DB_OWNER_PASS}
      DB_APP_USER: ${DB_APP_USER}
      DB_APP_PASS: ${DB_APP_PASS}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/docker-init.sh:/docker-entrypoint-initdb.d/10-init.sh:ro
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"     # para QGIS/DBeaver por túnel SSH
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_OWNER} -d ${DB_NAME}"]
      interval: 5s
      retries: 30

  importador:
    build:
      context: .
      dockerfile: infra/docker/herramientas.Dockerfile
    image: sig-caqueta/herramientas
    environment: *entorno-db
    volumes:
      - ./:/proyecto:ro
    command: ["bash", "/proyecto/infra/scripts/03_importar_datos.sh"]
    restart: "no"
    depends_on:
      postgis:
        condition: service_healthy

  geoserver:
    image: docker.osgeo.org/geoserver:${GS_VERSION}
    restart: unless-stopped
    environment:
      SKIP_DEMO_DATA: "true"
      GEOSERVER_ADMIN_USER: admin
      GEOSERVER_ADMIN_PASSWORD: ${GS_ADMIN_PASS}
      EXTRA_JAVA_OPTS: ${GS_JAVA_MEM}
    volumes:
      - gsdata:/opt/geoserver_data
    ports:
      - "127.0.0.1:${GS_PORT:-8080}:8080"     # panel de administración por túnel SSH
    depends_on:
      postgis:
        condition: service_healthy

  configurador:
    image: sig-caqueta/herramientas       # la construye el servicio importador
    pull_policy: never
    environment:
      <<: *entorno-db
      GS_URL: http://geoserver:8080/geoserver
      GS_ADMIN_PASS: ${GS_ADMIN_PASS}
      GS_WORKSPACE: ${GS_WORKSPACE}
      GS_STORE: ${GS_STORE}
    volumes:
      - ./:/proyecto:ro
    command: ["bash", "/proyecto/infra/docker/configurar-geoserver.sh"]
    restart: "no"
    depends_on:
      importador:
        condition: service_completed_successfully
      geoserver:
        condition: service_started

  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
    image: sig-caqueta/web
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORT:-8090}:80"
    depends_on:
      - geoserver

volumes:
  pgdata:
  gsdata:
