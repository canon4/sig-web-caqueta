# ==============================================================
#  Entorno de DESARROLLO local (lee las variables de .env)
#
#    docker compose up -d                       PostGIS + GeoServer (+ Nginx)
#    docker compose --profile tools run --rm importador   carga datos/ a PostGIS
#    cd frontend && npm install && npm run dev  visor con recarga en vivo: http://localhost:5173
#
#  GeoServer: http://localhost:8080/geoserver/web   (admin / GS_ADMIN_PASS)
#  Visor compilado (como en producción): http://localhost:8081
#  En el Data Store de GeoServer el host es "postgis", no localhost.
# ==============================================================
name: sig-web-caqueta

services:
  postgis:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_OWNER}
      POSTGRES_PASSWORD: ${DB_OWNER_PASS}
      DB_APP_USER: ${DB_APP_USER}
      DB_APP_PASS: ${DB_APP_PASS}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/docker-init.sh:/docker-entrypoint-initdb.d/10-init.sh:ro
      - ./db:/db:ro
    ports:
      - "127.0.0.1:5432:5432"      # solo para conectarte desde QGIS/DBeaver en tu PC
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_OWNER} -d ${DB_NAME}"]
      interval: 5s
      retries: 20

  geoserver:
    image: docker.osgeo.org/geoserver:${GS_VERSION}
    environment:
      SKIP_DEMO_DATA: "true"
      GEOSERVER_ADMIN_USER: admin
      GEOSERVER_ADMIN_PASSWORD: ${GS_ADMIN_PASS}
      EXTRA_JAVA_OPTS: ${GS_JAVA_MEM}
    volumes:
      - gsdata:/opt/geoserver_data
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgis:
        condition: service_healthy

  web:
    image: nginx:alpine
    ports:
      - "127.0.0.1:8081:80"
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./infra/nginx/docker.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - geoserver

  importador:
    image: ghcr.io/osgeo/gdal:ubuntu-small-latest
    profiles: ["tools"]
    volumes:
      - ./datos:/datos:ro
    environment:
      PG: "PG:host=postgis dbname=${DB_NAME} user=${DB_OWNER} password=${DB_OWNER_PASS}"
    entrypoint: ["bash", "-c"]
    command:
      - |
        set -e
        imp () { echo "-> $$2"; ogr2ogr -f PostgreSQL "$$PG" /datos/$$1 -nln $$2 -nlt $$3 -t_srs EPSG:4326 -lco GEOMETRY_NAME=geom -lco FID=id -lco SPATIAL_INDEX=GIST -overwrite; }
        imp municipios.geojson municipios MULTIPOLYGON
        imp zonas_riesgo.geojson zonas_riesgo MULTIPOLYGON
        imp vias.geojson vias LINESTRING
        imp hospitales.geojson hospitales POINT
        imp instituciones_educativas.geojson instituciones_educativas POINT
        echo "Listo. Crea la vista con:"
        echo "  docker compose exec -T postgis sh -c 'psql -U \$$POSTGRES_USER -d \$$POSTGRES_DB -v app=\$$DB_APP_USER -f /db/02_vistas.sql'"
    depends_on:
      postgis:
        condition: service_healthy

volumes:
  pgdata:
  gsdata:
