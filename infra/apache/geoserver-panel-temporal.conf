# ==============================================================
#  Apache · publica TEMPORALMENTE el panel de GeoServer
#     https://DOMINIO/geoserver/web   ->  contenedor geoserver (127.0.0.1:8086)
#
#  Úsalo solo mientras lo necesites (p. ej. durante una exposición) y desactívalo después.
#  Lo normal es administrar por túnel SSH:  ssh -L 8086:127.0.0.1:8086 usuario@servidor
#
#  Activar:
#    1. En .env:  GS_CSRF_WHITELIST=tu-dominio   (y una GS_ADMIN_PASS fuerte)
#       docker compose up -d geoserver
#    2. sudo cp infra/apache/geoserver-panel-temporal.conf /etc/apache2/conf-available/geoserver-panel.conf
#       sudo a2enconf geoserver-panel
#       sudo apache2ctl configtest && sudo systemctl reload apache2
#
#  Desactivar:
#    sudo a2disconf geoserver-panel && sudo systemctl reload apache2
#
#  Si cambias GS_PORT en .env, cambia también 8086 aquí.
# ==============================================================
<IfModule mod_proxy.c>
    ProxyPass        /geoserver/ http://127.0.0.1:8086/geoserver/
    ProxyPassReverse /geoserver/ http://127.0.0.1:8086/geoserver/

    <Location /geoserver/>
        # Conservar el dominio público: GeoServer arma sus enlaces y valida CSRF con él
        ProxyPreserveHost On
        RequestHeader set X-Forwarded-Proto "https"
        Header always set X-Robots-Tag "noindex, nofollow"
    </Location>
</IfModule>
