# ==============================================================
#  Apache · publica el SIG Web en una RUTA de los sitios existentes
#     https://DOMINIO/sig-caqueta/   ->  contenedor web (127.0.0.1:8090)
#
#  No modifica ningún VirtualHost: se instala como configuración global.
#    sudo cp infra/apache/sig-caqueta-ruta.conf /etc/apache2/conf-available/sig-caqueta.conf
#    sudo a2enmod proxy proxy_http headers
#    sudo a2enconf sig-caqueta
#    sudo apache2ctl configtest && sudo systemctl reload apache2
#
#  Para quitarlo:  sudo a2disconf sig-caqueta && sudo systemctl reload apache2
#  Si cambias WEB_PORT en .env, cambia también 8090 aquí.
# ==============================================================
<IfModule mod_proxy.c>
    # /sig-caqueta (sin barra) -> /sig-caqueta/  (el visor usa rutas relativas)
    RedirectMatch 301 ^/sig-caqueta$ /sig-caqueta/

    ProxyPass        /sig-caqueta/ http://127.0.0.1:8090/
    ProxyPassReverse /sig-caqueta/ http://127.0.0.1:8090/
    ProxyTimeout 120

    <Location /sig-caqueta/>
        RequestHeader set X-Forwarded-Proto expr=%{REQUEST_SCHEME}
        Header always set X-Content-Type-Options "nosniff"
    </Location>
</IfModule>
