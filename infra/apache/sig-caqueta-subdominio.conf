# ==============================================================
#  Apache · publica el SIG Web en un SUBDOMINIO propio
#     http(s)://sig.tudominio.com/  ->  contenedor web (127.0.0.1:8090)
#
#    sudo cp infra/apache/sig-caqueta-subdominio.conf /etc/apache2/sites-available/sig-caqueta.conf
#    sudo nano /etc/apache2/sites-available/sig-caqueta.conf     # cambia ServerName
#    sudo a2enmod proxy proxy_http headers
#    sudo a2ensite sig-caqueta
#    sudo apache2ctl configtest && sudo systemctl reload apache2
#    sudo certbot --apache -d sig.tudominio.com                   # HTTPS
# ==============================================================
<VirtualHost *:80>
    ServerName sig.tudominio.com

    ProxyPreserveHost On
    ProxyPass        / http://127.0.0.1:8090/
    ProxyPassReverse / http://127.0.0.1:8090/
    ProxyTimeout 120
    RequestHeader set X-Forwarded-Proto expr=%{REQUEST_SCHEME}

    ErrorLog  ${APACHE_LOG_DIR}/sig-caqueta_error.log
    CustomLog ${APACHE_LOG_DIR}/sig-caqueta_access.log combined
</VirtualHost>
