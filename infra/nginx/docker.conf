# ==============================================================
#  Nginx: sirve el visor Leaflet y hace de proxy inverso a GeoServer
#  Todo sale por el MISMO dominio/puerto -> no hace falta configurar CORS
#     http(s)://HOST/            -> visor (archivos estáticos)
#     http(s)://HOST/geoserver/  -> GeoServer (127.0.0.1:8080), solo servicios OGC
# ==============================================================
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # --- Visor web ---
    location / {
        try_files $uri $uri/ =404;
    }

    # --- Panel de administración y API REST: NO se publican ---
    # En desarrollo el panel se abre directo en http://localhost:8080/geoserver/web
    location ~ ^/geoserver/(web|rest)(/|$) {
        return 403;
    }

    # --- Servicios OGC (WMS, WFS, legendas) ---
    location /geoserver/ {
        proxy_pass         http://geoserver:8080/geoserver/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Cabeceras básicas de seguridad
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
    client_max_body_size 10m;
}
